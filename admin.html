<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ — АКМАН</title>
  <meta name="description" content="Управление каталогом ООО АКМАН">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=26">
</head>
<body data-active="" data-depth="0">
  <div id="site-header"></div>
  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Управление каталогом</h1>
        <p>Разделы, подкаталоги и позиции. Редактирование и удаление.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div id="admin-login" class="admin-wrap">
          <h2>Вход</h2>
          <p>Введите пароль администратора</p>
          <label for="admin-pass">Пароль</label>
          <input type="password" id="admin-pass" autocomplete="current-password">
          <div class="admin-actions">
            <button type="button" class="btn btn-blue" id="admin-login-btn">Войти</button>
          </div>
          <div id="admin-login-msg" class="admin-msg hidden"></div>
        </div>

        <div id="admin-panel" class="admin-wrap admin-panel-wide hidden">
          <div class="admin-toolbar">
            <button type="button" class="btn btn-outline" style="color:var(--blue-800);border-color:var(--blue-800)" id="export-btn">Скачать JSON</button>
            <button type="button" class="btn btn-outline" style="color:var(--blue-800);border-color:var(--blue-800)" id="import-btn">Импорт JSON</button>
            <input type="file" id="import-file" accept="application/json" class="hidden">
            <button type="button" class="btn btn-outline" style="color:#8a3030;border-color:#8a3030" id="logout-btn">Выйти</button>
          </div>
          <p class="admin-note">Изменения видны в этом браузере сразу. Чтобы на сайте у всех — скачайте JSON и замените <code>assets/catalog/catalog.json</code>.</p>
          <div id="admin-msg" class="admin-msg hidden"></div>

          <div class="admin-grid">
            <div class="admin-tree-card">
              <h2>Каталог</h2>
              <div id="admin-tree" class="admin-tree"></div>
            </div>

            <div class="admin-forms">
              <div class="admin-form-card">
                <h2 id="form-heading">Добавить / изменить</h2>
                <form id="entry-form">
                  <input type="hidden" id="e-id">

                  <label for="e-kind">Тип *</label>
                  <select id="e-kind" required>
                    <option value="section">Новый раздел (верхний уровень)</option>
                    <option value="folder">Подкаталог (как «Клапаны регулирующие»)</option>
                    <option value="product">Позиция / товар</option>
                  </select>

                  <label for="e-parent">Родитель</label>
                  <select id="e-parent"></select>

                  <label for="e-title">Название *</label>
                  <input id="e-title" required>

                  <label for="e-subtitle">Краткое описание</label>
                  <textarea id="e-subtitle" rows="2"></textarea>

                  <div id="specs-wrap">
                    <label for="e-specs">Характеристики (строка: Название | Значение)</label>
                    <textarea id="e-specs" rows="4" placeholder="Диаметр, мм | 15 ~ 150"></textarea>
                  </div>

                  <label for="e-image">Изображение (файл)</label>
                  <input type="file" id="e-image" accept="image/*">

                  <label for="e-image-url">или путь / URL</label>
                  <input id="e-image-url" placeholder="assets/images/...">

                  <div class="admin-actions">
                    <button type="submit" class="btn btn-blue" id="save-btn">Сохранить</button>
                    <button type="button" class="btn btn-outline" style="color:var(--blue-800);border-color:var(--blue-800)" id="reset-btn">Очистить форму</button>
                    <button type="button" class="btn btn-outline hidden" style="color:#8a3030;border-color:#8a3030" id="delete-btn">Удалить</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/phrases.js?v=26"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js?v=26"></script>
  <script src="js/catalog.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
