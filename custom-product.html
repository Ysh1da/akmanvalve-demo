<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Продукт — АКМАН</title>
  <meta name="description" content="Карточка оборудования ООО АКМАН">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=28">
  <link rel="icon" type="image/png" href="assets/images/logo-akman.png">
</head>
<body data-active="products" data-depth="0">
  <div id="site-header"></div>
  <main>
    <section class="page-banner">
      <div class="container">
        <h1 id="cp-title">Продукт</h1>
        <p id="cp-cat"></p>
      </div>
    </section>
    <section class="section">
      <div class="container about-split" id="cp-root">
        <p>Загрузка…</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/phrases.js?v=27"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js?v=27"></script>
  <script src="js/catalog.js"></script>
  <script>
    (async function () {
      const id = new URLSearchParams(location.search).get("id");
      const root = document.getElementById("cp-root");
      const titleEl = document.getElementById("cp-title");
      const catEl = document.getElementById("cp-cat");

      function escape(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      if (!id || !window.AkmanCatalog) {
        root.innerHTML = "<p>Продукт не найден.</p>";
        return;
      }

      const catalog = await AkmanCatalog.getCatalog();
      const p = AkmanCatalog.getNode(id, catalog);
      if (!p || p.kind === "folder") {
        root.innerHTML = "<p>Продукт не найден.</p>";
        return;
      }

      const parent = AkmanCatalog.getSection(p.parentId, catalog) || AkmanCatalog.getNode(p.parentId, catalog);
      const parentTitle = parent ? parent.title : "Каталог";
      const parentHref = parent
        ? parent.page || ("catalog.html?id=" + encodeURIComponent(parent.id))
        : "products.html";

      titleEl.textContent = p.title;
      catEl.textContent = parentTitle;
      document.title = p.title + " — АКМАН";

      const img =
        p.image && /^(data:|https?:|blob:)/i.test(p.image)
          ? p.image
          : p.image || "assets/images/b182b10a204b.png";

      const specs = (p.specs || [])
        .map((s) => `<tr><th>${escape(s.name)}</th><td>${escape(s.value)}</td></tr>`)
        .join("");

      root.innerHTML = `
        <div>
          <nav class="breadcrumb"><a href="index.html">Главная</a> <span>/</span> <a href="products.html">Наши продукты</a> <span>/</span> <a href="${parentHref}">${escape(parentTitle)}</a> <span>/</span> <strong>${escape(p.title)}</strong></nav>
          <p>${escape(p.subtitle || "")}</p>
          ${specs ? `<table class="specs"><tbody>${specs}</tbody></table>` : ""}
          <div class="hero-actions" style="margin-top:1.5rem">
            <a class="btn btn-blue" href="inquiry.html?product=${encodeURIComponent(p.title)}">Запросить ТКП</a>
            <a class="btn btn-outline" style="color:var(--blue-800);border-color:var(--blue-800)" href="${parentHref}">К разделу</a>
          </div>
        </div>
        <div class="about-photo"><img src="${img}" alt="${escape(p.title)}"></div>`;
    })();
  </script>
</body>
</html>
